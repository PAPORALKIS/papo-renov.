<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact - Papo Renov</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="../style.css" rel="stylesheet"/>
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet"/>
<style>
    /* Conteneur général centré avec max-width pour limiter la largeur */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0 1rem;
      box-sizing: border-box;
      overflow-x: hidden; /* éviter débordement horizontal */
      background: #fff;
    }
    header {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 1rem;
      padding: 0;
      margin: 0;
    }
    nav ul li a {
      text-decoration: none;
      color: #003366;
      font-weight: 600;
    }
    nav ul li a.active {
      text-decoration: underline;
    }

    .logo img {
      max-height: 50px;
      width: auto;
    }

    .titre-section, .contact-form {
      max-width: 700px;
      margin: 2rem auto;
      padding: 1rem;
      box-sizing: border-box;
    }
    .titre-section h1 {
      margin-bottom: 0.2rem;
      font-size: 2rem;
      color: #003366;
      text-align: center;
    }
    .titre-section p {
      text-align: center;
      color: #555;
      margin-top: 0;
      font-size: 1.1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      font-weight: 600;
      color: #003366;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
    }
    button[type="submit"] {
      background-color: #003366;
      color: white;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1.1rem;
      transition: background-color 0.3s ease;
    }
    button[type="submit"]:hover {
      background-color: #00509e;
    }

    .btn-contact-smartphone {
      margin-top: 1.5rem;
      text-align: center;
    }
    .btn-contact-smartphone a {
      color: #003366;
      font-weight: 600;
      text-decoration: none;
    }

    /* Responsive pour petits écrans */
    @media (max-width: 480px) {
      body {
        font-size: 12px;
      }
      h2 {
        font-size: 1.3rem;
      }
      th, td {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
<header>
<div class="logo">
<img alt="Logo Paporalkis" src="../img/logo.png"/>
</div>
<nav>
<ul>
<li><a href="../index.html">Accueil</a></li>
<li><a href="devis.html">Demande de devis</a></li>
<li><a href="realisations.html">Mes réalisations</a></li>
<li><a href="tarifs.html">Tarifs</a></li>
<li><a href="planning.html">Planning</a></li>
<li><a href="contact.html">Contact</a></li>
<li><a href="avis.html">Avis clients</a></li>
<li><a href="courtage-cuisine.html">Courtage Cuisine</a></li>
</ul>
</nav>
</header>
<section class="titre-section" data-aos="fade-down">
<h1>Contactez-nous</h1>
<p>Nous sommes à votre écoute pour tous vos projets de rénovation</p>
</section>
<section class="contact-form" data-aos="fade-up">
<form action="https://formspree.io/f/xvgrkwaq" method="POST">
<input name="_captcha" type="hidden" value="false"/>
<input name="_next" type="hidden" value="https://paporalkis.github.io/papo-renov/pages/confirmation.html"/>
<label for="name">Nom :</label>
<input id="name" name="name" required="" type="text"/>
<label for="email">Email :</label>
<input id="email" name="email" required="" type="email"/>
<label for="message">Message :</label>
<textarea id="message" name="message" required="" rows="5"></textarea>
<button type="submit">Envoyer</button>
</form>
<!-- Bouton pour smartphone uniquement -->
<div class="btn-contact-smartphone">
<a download="" href="../paporenov.vcf">
      📇 Ajouter ce professionnel à mes contacts
    </a>
</div>
</section>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({ duration: 800, once: true });
  function toggleMenu() {
    document.querySelector('nav ul').classList.toggle('active');
  }
</script>
</body>
</html>
